<style>

// Percentages are by data (bytes); never show 100% while any file is missing.
const pctOf=(okBytes,totalBytes,missingFiles,okFiles,totalFiles)=>{

const memName=m=>(dname(m.id)||'?')+(m.path?' / '+m.path:'');

// Slim bar under the header while something is happening (scans, backup checks); hidden otherwise.

function wireReorder(){
  const items=[...document.querySelectorAll('#drives [data-sec]')];
  const clear=()=>items.forEach(x=>x.classList.remove('dropb','dropa','dragsrc'));
  items.forEach(el=>{
    el.addEventListener('dragstart',e=>{dragging={sec:el.dataset.sec,id:+el.dataset.oid};el.classList.add('dragsrc');e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',el.dataset.oid)}catch(_){}});

// Eject button for connected external drives and network shares

// The list-density button shows which mode you're in: rows with details, or a compact list.
const ICON_FULL='<svg width="16" height="14" viewBox="0 0 16 14" fill="currentColor" aria-hidden="true"><rect x="1" y="1" width="14" height="2.4" rx="1.2"/><rect x="1" y="4.6" width="9" height="1.5" rx=".75" opacity=".5"/><rect x="1" y="8" width="14" height="2.4" rx="1.2"/><rect x="1" y="11.6" width="9" height="1.5" rx=".75" opacity=".5"/></svg>';
const ICON_COMPACT='<svg width="16" height="14" viewBox="0 0 16 14" fill="currentColor" aria-hidden="true"><rect x="1" y="1.2" width="14" height="1.7" rx=".85"/><rect x="1" y="4.6" width="14" height="1.7" rx=".85"/><rect x="1" y="8" width="14" height="1.7" rx=".85"/><rect x="1" y="11.4" width="14" height="1.7" rx=".85"/></svg>';

    ${s.syncFolder?'<button id="s_syncnow">Sync now</button><button id="s_syncoff" class="danger">Stop sharing</button>':''}</div>
  <h3>Feedback</h3><div class="row" id="s_fb"><button id="s_fb_bug">Report a problem</button><button id="s_fb_idea">Suggest an idea</button>
    <span class="mute" style="font-size:12px;width:100%">Opens a short form on GitHub (sign in needed) with your DriveDex and macOS versions filled in. Please don't include private file names you don't want others to see: the feedback page is public.</span></div>
  <h3>Help</h3><div class="row"><button id="s_guide">Open the user guide (PDF)</button><button id="s_setup">Run the setup guide again</button></div>
  <h3>Updates</h3><div class="row" id="uprow"><span class="mute">Checking…</span></div>
  <h3>About</h3><div class="mute">DriveDex ${esc(s.version)} on ${esc(s.machine)}<br>Working copy on this Mac (fast searching, works offline): ${esc(s.catalogPath)}${s.syncFolder?`<br>Shared copy, exchanged with your other Macs: ${esc(s.syncFolder)}`:''}</div></div>`;
  const save=()=>api('setSettings',{openAtLogin:$('#s_login').checked,notify:$('#s_notify').checked,showMenuBarIcon:$('#s_menubar').checked,askNew:$('#s_ask').checked,strictCheck:$('#s_strict').checked,rescanAfterHours:parseFloat($('#s_rescan').value)||0,
    periodicRescanHours:parseFloat($('#s_periodic').value)||12,includeHidden:$('#s_hidden').checked,skipDiskImages:$('#s_dmg').checked,
    ignoreVolumes:$('#s_ignore').value.split('\n')}).then(r=>{toast(r.loginStatus=='requiresApproval'?'Approve DriveDex in System Settings → Login Items':'Saved')});
  document.querySelectorAll('#view input,#view textarea').forEach(i=>i.onchange=save);
  if($('#li'))$('#li').onclick=e=>{e.preventDefault();api('openLoginItems')};
  api('updateStatus').then(u=>{const el=$('#uprow');if(!el)return;
    el.innerHTML=(u.available?`<span class="okc">DriveDex ${esc(u.version)} is available.</span> <button class="primary" id="s_update">Install &amp; Relaunch</button>`:`<span class="mute">${u.checked?`Up to date (${esc(u.current)}). Last checked ${ago(u.checked)}.`:'Not checked yet.'}</span>`)
      +` <button id="s_check">Check now</button>${u.error?` <span class="errc">${esc(u.error)}</span>`:''}<div class="mute" style="font-size:12px;width:100%">DriveDex looks for updates automatically a few times a day. Updates installed from here don't need "Open Anyway".</div>`;
    if($('#s_update'))$('#s_update').onclick=installUpdate;
    $('#s_check').onclick=()=>{$('#s_check').textContent='Checking…';checkUpdates(true)}});
  $('#s_setup').onclick=openSetup;$('#s_guide').onclick=()=>api('openGuide');
  $('#s_fb_bug').onclick=()=>api('feedback',{kind:'bug'});$('#s_fb_idea').onclick=()=>api('feedback',{kind:'idea'});
  const sync=(a,msg)=>api(a).then(()=>{if(msg)toast(msg);openSettings()}).catch(e=>toast(e.message));
  if($('#s_icloud'))$('#s_icloud').onclick=()=>sync('syncICloud','Sharing through iCloud Drive');
  $('#s_choose').onclick=()=>sync('syncChoose');
  if($('#s_syncnow'))$('#s_syncnow').onclick=()=>sync('syncNow','Syncing…');
  if($('#s_syncoff'))$('#s_syncoff').onclick=()=>sync('syncOff','Stopped sharing. Your catalog stays on this Mac.');
}
$('#gear').onclick=toggleSettings;
$('#home').onclick=goHome;
document.addEventListener('click',e=>{const b=e.target.closest('[data-nav]');if(b&&!b.disabled)goNav(+b.dataset.nav)});
document.addEventListener('keydown',e=>{
  const t=document.activeElement.tagName,typing=t=='INPUT'||t=='TEXTAREA'||t=='SELECT';
  if(e.metaKey&&!e.altKey&&(e.key=='['||(!typing&&e.key=='ArrowLeft'))){e.preventDefault();goNav(-1)}
  else if(e.metaKey&&!e.altKey&&(e.key==']'||(!typing&&e.key=='ArrowRight'))){e.preventDefault();goNav(1)}
  else if(e.metaKey&&!e.shiftKey&&(e.key=='z'||e.key=='Z')&&!typing){e.preventDefault();undoLast()}});
document.addEventListener('mouseup',e=>{if(e.button==3){e.preventDefault();goNav(-1)}else if(e.button==4){e.preventDefault();goNav(1)}});
loadDrives();
</script></body></html>
